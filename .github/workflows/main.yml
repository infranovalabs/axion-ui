name: axion-ui

on: workflow_dispatch

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: axion-ui
  IMAGE_TAG: v1
  ACR_NAME: acrtodoappbappa
  ACR_LOGIN_SERVER: acrtodoappbappa.azurecr.io

jobs:
  Database-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout postgresql server
        uses: actions/checkout@v4
        
      - name: Azure Login
        uses: azure/login@v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Login
        run: az account show      

      - name: Show Files
        run: ls

      - name: log in to ACR
        run: |
          az acr login --name ${{env.ACR_NAME}}

      - name: Build Docker Image
        run: docker build -t ${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}} .

      - name: Tag Docker Image for ACR
        run: docker tag ${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}} ${{env.ACR_LOGIN_SERVER}}/${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}

      - name: Push Docker image to ACR
        run: docker push ${{env.ACR_LOGIN_SERVER}}/${{env.IMAGE_NAME}}:${{env.IMAGE_TAG}}
        
      - name: connect to AKS
        run: az aks get-credentials --resource-group jaydeep_rg1 --name jaydeep-aks-cluster --overwrite-existing


     
